# Conformance CI (spec §9 Phase 4 step 2 invariant): a release requires the
# Swift AND Go implementations green against the same golden vectors, plus the
# live Swift<->Go interop handshake.
name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go conformance + cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go vet
        run: cd core && go vet ./...
      - name: Go unit tests
        run: cd core && go test ./...
      - name: Go conformance against golden vectors
        run: cd core && go run ./cmd/conformance ../proto/vectors
      - name: Cross-compile daemons (linux, windows, darwin)
        run: |
          cd core
          GOOS=linux   GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...

  kotlin:
    name: Kotlin conformance + session smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip -o kotlinc.zip
          unzip -q kotlinc.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile the Kotlin core
        run: cd android/core && kotlinc $(find src/main/kotlin -name '*.kt') -include-runtime -d /tmp/conduit-core.jar
      - name: Kotlin conformance against golden vectors
        run: java -cp /tmp/conduit-core.jar org.conduit.core.Conformance proto/vectors
      - name: Kotlin session smoke (pair + file + clipboard)
        run: java -cp /tmp/conduit-core.jar org.conduit.core.SessionSmoke

  android-apk:
    name: Android app assembles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's ubuntu image preinstalls the Android SDK (ANDROID_HOME is
      # set); the committed Gradle wrapper does the rest. A green run proves
      # the app COMPILES — nothing more (android/README.md).
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon :app:assembleDebug
      # assembleDebug does NOT run lint, which is exactly how the declared
      # `minSdk 28` stayed a lie while an API-33 call (EdECPrivateKeySpec) sat on
      # the first-launch path: the APK built clean and the app died on launch for
      # every Android 9–12 user. NewApi is the check that matters; the first run
      # of this gate also found two manifest permissions Wi-Fi Aware needs and
      # never declared (2026-08-17).
      - name: Lint debug variant
        run: cd android && ./gradlew --no-daemon :app:lintDebug

  swift:
    name: Swift full suite + conformance + interop
    # macos-26: the suite is only ever verified on macOS 26 + Xcode 26 (the
    # dev machine). The package floor is macOS 15 / Swift 6.1, so macos-15
    # might work — but "might" is not the bar; pin to the proven environment.
    # Verified on GitHub-hosted runners: green on main since 2026-08-12
    # (all four jobs — Swift 126/126, Go 52/52, Kotlin 70/70, Android APK).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Regenerate vectors and check they are unchanged
        run: |
          cd apple/ConduitKit
          swift run conduit-vectorgen ../../proto/vectors
          cd ../..
          # Append-only invariant: regeneration must not alter committed vectors
          # (pairing.json is skipped by the generator; it holds a random signature).
          git diff --exit-code proto/vectors/messages.json proto/vectors/chunk_frames.json proto/vectors/screen_frames.json
      - name: Build tests
        # Separate from the run so a compile break reads as a compile break
        # rather than a mystery test failure.
        run: cd apple/ConduitKit && swift build --build-tests --disable-sandbox
      - name: Full Swift test suite
        # The FULL suite, deliberately unfiltered. Until now CI ran only
        # --filter "VectorConformance|PairingVectorConformance|GoInteropTests",
        # so every E2E suite -- screen, input, broadcast, control-lane fallback,
        # multi-viewer -- was invisible here. That gap is exactly how three
        # broken headline flows shipped alongside "102 tests green".
        #
        # --disable-sandbox is REQUIRED, not cosmetic: swift test under the
        # macOS sandbox hangs (not fails) on the Network.framework, PKCS#12 and
        # VideoToolbox paths. See docs/TESTING_PLAN.md §1. Do not "clean this up".
        run: cd apple/ConduitKit && swift test --disable-sandbox
      - name: Real-LAN E2E (informational)
        # RealNetworkE2ETests self-skips unless CONDUIT_LAN_E2E is set AND
        # getifaddrs finds a routable LAN address. Hosted runners have an IP but
        # unreliable multicast/Bonjour, so this reports signal without gating the
        # build on runner networking. A red here is worth reading, not trusting.
        continue-on-error: true
        env:
          CONDUIT_LAN_E2E: "1"
        run: cd apple/ConduitKit && swift test --disable-sandbox --filter "RealNetworkE2ETests"
