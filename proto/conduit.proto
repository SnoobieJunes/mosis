// Conduit control-message schema — INFORMATIVE.
//
// The normative v1 wire format is canonical JSON (see docs/protocol.md and
// docs/adr/0008). This .proto documents the message shapes and reserves field
// numbers so a future protobuf encoding — should bandwidth or typing ever
// demand it — can be added as a negotiated mode without re-litigating the
// layout. It is NOT the current wire format; do not generate a codec from it
// and expect interop today.
//
// Field names match the JSON keys (snake_case). Bulk data (file chunks, screen
// frames) is raw binary framing, never protobuf — see docs/protocol.md §Framing.

syntax = "proto3";

package conduit.v1;

option go_package = "github.com/auston/conduit-core/protogen";

// Envelope is the frozen outer shape carried by every control message.
message Envelope {
  string version = 1;      // "0.2"
  string type = 2;         // MessageType discriminator, e.g. "HELLO"
  string session_id = 3;
  uint64 seq = 4;
  bytes payload = 5;       // one of the *Body messages below, by type
}

enum DeviceClass {
  DEVICE_CLASS_UNKNOWN = 0;
  DEVICE_CLASS_PHONE = 1;
  DEVICE_CLASS_TABLET = 2;
  DEVICE_CLASS_LAPTOP = 3;
  DEVICE_CLASS_DESKTOP = 4;
  DEVICE_CLASS_TV = 5;
}

message Hello {                        // HELLO / HELLO_ACK
  string identity = 1;
  string name = 2;
  string device_class = 3;
  string app_version = 4;
  bytes pubkey = 5;                    // Ed25519 raw
  repeated string capabilities = 6;
  repeated string platform_walls = 7;
  optional uint32 listen_port = 8;
}

message Ping { string nonce = 1; uint64 t = 2; }   // PING / PONG

message Pair {                         // PAIR_REQUEST / PAIR_RESPONSE
  string identity = 1;
  string name = 2;
  string device_class = 3;
  bytes pubkey = 4;
  string tls_pubkey_sha256 = 5;
  bytes binding_sig = 6;
}
message PairReject { string reason = 1; }

message ClipboardPush { string mime = 1; bytes data = 2; }

message FileOffer {
  string file_id = 1;
  string name = 2;
  uint64 size = 3;
  string mime = 4;
  string sha256 = 5;
  uint32 chunk_size = 6;
  uint64 chunk_count = 7;
}
message FileAccept { string file_id = 1; uint64 resume_from_chunk = 2; string bulk_token = 3; }
message FileReject { string file_id = 1; string reason = 2; }
message FileAck { string file_id = 1; string status = 2; uint64 acked_through = 3; optional string message = 4; }
message BulkAttach { string file_id = 1; string bulk_token = 2; }

message InputEvent {                   // INPUT_EVENT (Phase 2)
  string kind = 1;                     // move | scroll | click | key
  optional double dx = 2;
  optional double dy = 3;
  optional string button = 4;          // left | right | middle
  optional string action = 5;          // down | up | tap
  optional int32 click_count = 6;
  optional string key = 7;
  optional string text = 8;
  repeated string modifiers = 9;       // shift control option command function
}
message InputStatus {
  bool active = 1;
  optional string reason = 2;
  optional uint32 udp_port = 3;
  optional string datagram_token = 4;
  optional bool secure_input = 5;
}
message InputAttach { string token = 1; }
message MediaControl { string action = 1; optional double value = 2; }

message ScreenRequest {                // SCREEN_* (Phase 3)
  optional int32 max_width = 1;
  optional int32 max_height = 2;
  optional int32 max_fps = 3;
  repeated string codecs = 4;          // hevc | h264
}
message ScreenOffer {
  string screen_session_id = 1;
  uint32 wire_session_id = 2;
  string codec = 3;
  int32 width = 4;
  int32 height = 5;
  int32 fps = 6;
  string capture_kind = 7;             // display | window
  string source_name = 8;
  string bulk_token = 9;
}
message ScreenReject { string reason = 1; }
message ScreenAttach { string screen_session_id = 1; string bulk_token = 2; }
message ScreenAck { string screen_session_id = 1; uint32 acked_seq = 2; bool request_keyframe = 3; }
message ScreenEnd { string screen_session_id = 1; optional string reason = 2; }

message Notification {                 // NOTIFICATION (Phase 4)
  string app_name = 1;
  string title = 2;
  string body = 3;
  string id = 4;
  repeated string actions = 5;
}
