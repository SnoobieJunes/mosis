# XcodeGen project definition. Regenerate with: xcodegen generate
# (brew install xcodegen). The generated .xcodeproj is committed for
# convenience; this file is the source of truth.
name: ConduitApps
options:
  bundleIdPrefix: org.auston.mosis
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  ConduitKit:
    path: ../ConduitKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Product name is decided: MOSIS (ADR 0014). Bundle IDs are final —
    # org.auston.mosis[.mac|.tv|.broadcast]. Do NOT "fix" the iOS app to
    # org.auston.mosis.ios: the iOS keychain access group is derived from the
    # bundle ID, so changing it orphans the device identity and forces a
    # re-pair. That already happened once in e6c6eb3.
    # DEVELOPMENT_TEAM is set per-target in the pbxproj so TCC grants stick.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: false

targets:
  Conduit-macOS:
    type: application
    platform: macOS
    sources: [ConduitMac]
    dependencies:
      - package: ConduitKit
        product: ConduitUI
    settings:
      base:
        PRODUCT_NAME: Conduit
        PRODUCT_BUNDLE_IDENTIFIER: org.auston.mosis.mac
        # Hardened runtime, NOT sandboxed: the App Sandbox has no entitlement
        # that permits CGEvent injection into other apps, which is Phase 2's
        # Mac receiver role. Non-sandboxed + Accessibility (TCC) is the standard
        # for input tools (Karabiner, BTT, Synergy). See docs/adr/0005.
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: false
    entitlements:
      path: ConduitMac/Conduit.entitlements
      properties:
        # Non-sandboxed: no sandbox key. Hardened-runtime exceptions only.
        com.apple.security.automation.apple-events: false
    info:
      path: ConduitMac/Info.plist
      properties:
        CFBundleDisplayName: MOSIS
        CFBundleName: MOSIS
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: >-
          MOSIS discovers your own devices on your local network and connects
          to them directly to move files and clipboard content between them.
          Nothing leaves your network.
        NSBonjourServices: ["_cndt-app._tcp"]
        NSHumanReadableCopyright: ""

  Conduit-iOS:
    type: application
    platform: iOS
    sources: [ConduitIOS]
    dependencies:
      - package: ConduitKit
        product: ConduitUI
      - target: ConduitBroadcast
        embed: true
    settings:
      base:
        PRODUCT_NAME: Conduit
        PRODUCT_BUNDLE_IDENTIFIER: org.auston.mosis
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: ConduitIOS/Conduit.entitlements
      properties:
        # XcodeGen REWRITES the entitlements file at `path` from these
        # properties on every `xcodegen generate`. Anything present in the file
        # but absent here is silently deleted. This block dropped
        # com.apple.developer.wifi-aware once already — the project's long pole
        # (ADR 0003), granted and verified embedded in a signed build, removed
        # by the regenerate step the README tells you to run. Verified by
        # regenerating into a scratch copy and diffing.
        # If you add a capability in Xcode's UI, mirror it HERE or lose it.
        com.apple.developer.wifi-aware: [Publish, Subscribe]
        com.apple.security.application-groups: [group.org.auston.mosis]
    info:
      path: ConduitIOS/Info.plist
      properties:
        CFBundleDisplayName: MOSIS
        # CFBundleName drives the macOS menu bar and the Settings app row.
        # PRODUCT_NAME is deliberately left as Conduit for now: it names the
        # built .app on disk, and TCC grants have already been reset once by
        # the identifier changes in e6c6eb3. Rename it after the device
        # sessions pass, not before.
        CFBundleName: MOSIS
        NSLocalNetworkUsageDescription: >-
          MOSIS discovers your own devices on your local network and connects
          to them directly to move files, clipboard, and screen content between
          them. Nothing leaves your network.
        NSBonjourServices: ["_cndt-app._tcp"]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  # tvOS viewer app (spec §9 Phase 6 step 1): Apple TV as a Conduit screen
  # viewer + media target + notification display. LAN only (no Aware on tvOS).
  Conduit-tvOS:
    type: application
    platform: tvOS
    sources: [ConduitTV]
    dependencies:
      - package: ConduitKit
        product: ConduitCapabilities
    settings:
      base:
        PRODUCT_NAME: Conduit
        PRODUCT_BUNDLE_IDENTIFIER: org.auston.mosis.tv
    info:
      path: ConduitTV/Info.plist
      properties:
        CFBundleDisplayName: MOSIS
        CFBundleName: MOSIS
        NSLocalNetworkUsageDescription: >-
          MOSIS discovers your own devices on your local network and connects
          to them directly to show their screen on this Apple TV.
        NSBonjourServices: ["_cndt-app._tcp"]

  # ReplayKit broadcast upload extension: streams the iPhone screen to a paired
  # viewer (spec §9 Phase 3 step 4). Device-only; see docs/adr/0006.
  ConduitBroadcast:
    type: app-extension
    platform: iOS
    sources: [ConduitBroadcast]
    dependencies:
      - package: ConduitKit
        product: ConduitCapabilities
    settings:
      base:
        ENABLE_DEBUG_DYLIB: NO
        PRODUCT_NAME: ConduitBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: org.auston.mosis.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: ConduitBroadcast/ConduitBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.org.auston.mosis]
    info:
      path: ConduitBroadcast/Info.plist
      properties:
        CFBundleDisplayName: MOSIS Screen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
